name: build-bazzite-iso

# Bun Bun OS on top of Bazzite: Steam Deck LCD and OLED, plus AMD and
# NVIDIA handheld/PC ISO variants. The build target is resolved through
# packaging/bazzite/targets.json, so every variant keeps its own pinned
# upstream image.
#
# Bazzite's own ISO boots the *desktop* image and installs the *Deck* image
# from container storage; booting the Deck image would start Gaming Mode, which
# is no place to run an installer.  This workflow does the same:
#
#   bunny-deck    = ghcr.io/ublue-os/bazzite-deck:stable + the Bunny OS layer
#                   (the image that ends up on the Deck)
#   bunny-live    = ghcr.io/ublue-os/bazzite:stable + Anaconda + bunny-deck
#                   in container storage (the image titanoboa turns into the ISO)
#
# The Deck therefore keeps the boot chain, kernel, firmware and Gaming Mode that
# are known to work on the hardware, and still runs Bunny OS.
#
# A run takes 60-120 minutes and needs roughly 60 GB of disk, which is why the
# job frees the runner and puts podman's storage on a btrfs loopback first.

on:
  workflow_dispatch:
    inputs:
      base_image:
        description: "Bazzite Deck image (installed on the Deck)"
        type: string
        default: ghcr.io/ublue-os/bazzite-deck:stable
      live_image:
        description: "Bazzite desktop image (live installer environment)"
        type: string
        default: ghcr.io/ublue-os/bazzite:stable
      iso_label:
        description: "ISO volume label"
        type: string
        default: BunnyOS-Live
      target:
        description: "Build target (see packaging/bazzite/targets.json)"
        type: string
        default: deck-lcd
  push:
    tags: ["v*-bazzite"]

permissions:
  contents: write

env:
  # Per-target images and ISO names are resolved by the "Resolve build
  # target" step from packaging/bazzite/targets.json.
  # Pinned so a change upstream cannot silently alter the image under us.
  TITANOBOA_ACTION: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4

concurrency:
  group: build-bazzite-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static verification
        run: python3 tools/verify.py --strict
      - name: Shell syntax
        run: |
          set -euo pipefail
          bash -n packaging/portable/install.sh
          bash -n packaging/portable/uninstall.sh
          bash -n packaging/portable/bin/bunny-os
          bash -n packaging/portable/bin/bunny-os-setup
          bash -n packaging/bazzite/live-iso.sh
          bash -n scripts/build-portable.sh

  build:
    name: build Bazzite Deck ISO
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: true

      - name: Put container storage on a btrfs loopback
        run: |
          set -euo pipefail
          sudo truncate -s 110G /mnt/podman-storage.img
          sudo mkfs.btrfs -f -m single -d single /mnt/podman-storage.img
          sudo podman system reset --force
          sudo systemctl stop podman.service
          LOOP=$(sudo losetup --find --show --direct-io=on /mnt/podman-storage.img)
          sudo mkdir -p /mnt/podman-storage
          sudo mount -o compress-force=zstd:2,discard=async,noatime "$LOOP" /mnt/podman-storage
          sudo mkdir -p /mnt/podman-storage/storage /mnt/podman-storage/tmp
          sudo mount --bind /mnt/podman-storage/storage /var/lib/containers/storage
          sudo systemctl start podman.service
          sudo df -h /var/lib/containers/storage

      - uses: actions/checkout@v4

      - name: Resolve build target
        env:
          IN_TARGET: ${{ inputs.target || 'deck-lcd' }}
          IN_BASE: ${{ inputs.base_image }}
          IN_LIVE: ${{ inputs.live_image }}
          IN_LABEL: ${{ inputs.iso_label }}
        run: |
          set -euo pipefail
          # Write the resolved values to a temp file, append them to
          # GITHUB_ENV for later steps, and print the summary from the file
          # itself. GITHUB_ENV vars are NOT visible in the same step, so the
          # summary must not reference them (bash set -u fails otherwise).
          python3 - > /tmp/bunny-target.env <<'PY'
          import json, os
          t = json.load(open("packaging/bazzite/targets.json"))
          tid = os.environ["IN_TARGET"].strip()
          if tid not in t:
              raise SystemExit(f"unknown build target '{tid}'; choose one of: " + ", ".join(k for k in t if not k.startswith('_')))
          d = t[tid]
          version = open("VERSION").read().strip()
          print(f"TARGET_ID={tid}")
          print(f"TARGET_LABEL={d['label']}")
          print(f"BASE_IMAGE={os.environ.get('IN_BASE') or d['base_image']}")
          print(f"LIVE_IMAGE={os.environ.get('IN_LIVE') or d['live_image']}")
          print(f"ISO_LABEL={os.environ.get('IN_LABEL') or d['iso_label']}")
          print(f"IMAGE_REF=localhost/bunny-{tid}:latest")
          print(f"ISO_NAME=BunBunOS-{tid}-{version}.iso")
          print(f"ISO_DESC={d['description']}")
          PY
          cat /tmp/bunny-target.env >> "$GITHUB_ENV"
          python3 - <<'PY'
          env = {}
          for line in open("/tmp/bunny-target.env").read().splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  env[k] = v
          print(f"target : {env['TARGET_ID']} ({env['TARGET_LABEL']})")
          print(f"payload: {env['IMAGE_REF']}")
          print(f"iso    : {env['ISO_NAME']} (label {env['ISO_LABEL']})")
          PY

      - name: Build the portable payload
        run: |
          set -euo pipefail
          bash scripts/build-portable.sh --out out
          cp out/bunny-os-portable-*.tar.gz packaging/bazzite/bunny-os-portable.tar.gz
          ls -lh packaging/bazzite/bunny-os-portable.tar.gz

      - name: Build the Bun Bun OS payload image
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin --security-opt label=disable \
            --build-arg BASE_IMAGE="${BASE_IMAGE}" \
            --build-arg BUNNY_VERSION="${VERSION}" \
            -t "${IMAGE_REF}" \
            packaging/bazzite/
          sudo podman images --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Save the payload as an OCI archive
        run: |
          set -euo pipefail
          # The live image loads this and Anaconda installs from it, so the
          # install needs no registry and no network.
          sudo podman save --format oci-archive \
            -o packaging/bazzite/bunny-deck.oci "${IMAGE_REF}"
          sudo chown "$(id -u):$(id -g)" packaging/bazzite/bunny-deck.oci
          ls -lh packaging/bazzite/bunny-deck.oci

      - name: Build the live installer image
        run: |
          set -euo pipefail
          # Bazzite's own ISO boots the desktop image and installs the Deck
          # image; booting the Deck image would start Gaming Mode instead of a
          # desktop, so the live environment is the desktop image.
          sudo env TMPDIR=/mnt/podman-storage/tmp podman build \
            --cap-add sys_admin --security-opt label=disable \
            --build-arg LIVE_IMAGE="${LIVE_IMAGE}" \
            --build-arg ISO_LABEL="${ISO_LABEL}" \
            --build-arg PAYLOAD_TAG="${IMAGE_REF}" \
            -t localhost/bunny-live:latest \
            -f packaging/bazzite/Containerfile.live \
            packaging/bazzite/
          sudo podman images --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Show disk space
        if: always()
        run: sudo df -h

      - name: Build the ISO
        id: iso
        uses: ublue-os/titanoboa@5c457c3d0518bd17e754be0fd98a60d29d26abb4
        with:
          image-ref: localhost/bunny-live:latest
          # Absolute: the action moves the ISO relative to its own directory
          # when this is a bare filename, and the upload would not find it.
          iso-dest: ${{ github.workspace }}/${{ env.ISO_NAME }}

      - name: Checksum
        id: checksum
        run: |
          set -euo pipefail
          iso="${{ steps.iso.outputs.iso-dest }}"
          test -s "${iso}"
          echo "iso=${iso}" >> "$GITHUB_OUTPUT"
          # Bare file name in the checksum file: whoever downloads it does not
          # have the runner's directory, and neither does `sha256sum -c`.
          ( cd "$(dirname "${iso}")" \
            && sha256sum "$(basename "${iso}")" | tee "$(basename "${iso}").sha256" )
          ls -lh "${iso}"

      # Best effort: a 7 GB artefact is close to the limit and the release below
      # is the delivery path.  A failed upload must not fail the run.
      - name: Upload ISO artefact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ISO_NAME }}-${{ github.run_number }}
          path: |
            ${{ env.ISO_NAME }}
            ${{ env.ISO_NAME }}.sha256
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0

      - name: Split the ISO for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          iso="${{ steps.iso.outputs.iso-dest }}"
          test -s "${iso}"
          rm -rf dist
          mkdir -p dist
          cp "${iso}.sha256" dist/
          # Same tarball that went into the image, so an existing Bazzite can
          # get the panel without reinstalling.
          cp out/bunny-os-portable-*.tar.gz out/bunny-os-portable-*.tar.gz.sha256 dist/
          size="$(stat -c %s "${iso}")"
          base="$(basename "${iso}")"
          : > dist/READ-ME-FIRST.txt
          {
            echo "Bunny OS on Bazzite - ${base}"
            echo
            if [ "${size}" -gt 2000000000 ]; then
              # GitHub refuses assets above 2 GiB, so the image ships as parts.
              ( cd dist && split -b 1900M -d --numeric-suffixes=1 \
                  --suffix-length=2 --additional-suffix=.part "${iso}" "${base}." )
              mapfile -t parts < <(cd dist && ls "${base}".*.part)
              join_cmd="$(IFS=+; echo "${parts[*]}")"
              echo "This image is larger than GitHub's 2 GiB asset limit, so it"
              echo "ships as ${#parts[@]} parts.  Download all of them:"
              echo
              for part in "${parts[@]}"; do echo "    ${part}"; done
              echo
              echo "Then join them, in order, into ${base}:"
              echo
              echo "    windows      copy /b ${join_cmd} ${base}"
              echo "    linux/macos  cat ${base}.??.part > ${base}"
              echo
              echo "Check the result against ${base}.sha256, then flash it:"
            else
              cp "${iso}" dist/
              echo "Check the result against ${base}.sha256, then flash it:"
            fi
            echo
            echo "    windows      Rufus -> ISO Image mode (not DD mode)"
            echo "    linux        dd if=${base} of=/dev/sdX bs=4M status=progress"
            echo
            echo "On the Steam Deck: power off, hold Volume Down, press Power and"
            echo "pick the USB device.  Secure Boot has to be off."
            echo
            echo "The installer runs from the stick.  Choose the internal drive,"
            echo "reboot without the stick, and Bunny OS starts on first login."
            echo
            echo "Already running Bazzite and just want the panel?  The portable"
            echo "tarball installs Bunny OS into an existing system without"
            echo "touching the bootloader, the kernel or your account:"
            echo
            echo "    tar xzf bunny-os-portable-*.tar.gz -C /tmp"
            echo "    sudo /tmp/bunny-os-portable-*/install.sh"
          } > dist/READ-ME-FIRST.txt
          cat dist/READ-ME-FIRST.txt
          ls -lh dist

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes="Bun Bun OS on Bazzite for the ${TARGET_LABEL} (${TARGET_ID}). The medium installs the Bazzite base image with the Bun Bun OS Control Panel, bridge and first-boot wizard layered on top. Read READ-ME-FIRST.txt before flashing."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" dist/* \
              --title "Bun Bun OS on Bazzite ${TAG#v}" \
              --notes "${notes}" --prerelease
          fi

      - name: Build log on failure
        if: failure()
        run: sudo journalctl -u podman --no-pager | tail -200 || true
