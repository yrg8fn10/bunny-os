<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bunny taskbar</title>
<link rel="stylesheet" href="/css/taskbar.css">
</head>
<body>
  <main class="dock" id="dock" aria-label="Bunny taskbar">
    <button class="launcher bunny" id="app-bunny" data-app="bunny" tabindex="0" aria-label="Bun Bun and the Control Panel">
      <span class="glyph" aria-hidden="true">
        <svg viewBox="0 0 64 64"><g fill="none" stroke="#FF9ABF" stroke-width="5" stroke-linecap="round">
          <path d="M18 30 C12 16 16 10 24 14 C29 17 31 22 32 27"/>
          <path d="M46 30 C52 16 48 10 40 14 C35 17 33 22 32 27"/>
        </g><circle cx="32" cy="38" r="12" fill="#FF9ABF"/>
        <circle cx="27.5" cy="36.5" r="1.9" fill="#4A2338"/><circle cx="36.5" cy="36.5" r="1.9" fill="#4A2338"/>
        <path d="M29 42 Q32 45 35 42" stroke="#4A2338" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
      </span>
      <span class="dot" data-dot="bunny"></span>
    </button>
    <span class="divider" aria-hidden="true"></span>
    <button class="launcher" id="app-steam" data-app="steam" tabindex="0" aria-label="Steam">
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="22" fill="none" stroke="#7FB2D9" stroke-width="5"/><circle cx="41" cy="24" r="7" fill="none" stroke="#7FB2D9" stroke-width="5"/><path d="M14 38 L30 41 A6 6 0 1 0 40 44 L22 34" fill="#7FB2D9" stroke="none"/></svg></span>
      <span class="dot" data-dot="steam"></span>
    </button>
    <button class="launcher" id="app-files" data-app="files" tabindex="0" aria-label="Files">
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 64 64"><path d="M10 20 A4 4 0 0 1 14 16 H26 L32 23 H50 A4 4 0 0 1 54 27 V44 A4 4 0 0 1 50 48 H14 A4 4 0 0 1 10 44 Z" fill="#F7D6E0" stroke="#E39CB8" stroke-width="3"/></svg></span>
      <span class="dot" data-dot="files"></span>
    </button>
    <button class="launcher" id="app-browser" data-app="browser" tabindex="0" aria-label="Web browser">
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="21" fill="none" stroke="#8FBFAF" stroke-width="4.5"/><ellipse cx="32" cy="32" rx="10" ry="21" fill="none" stroke="#8FBFAF" stroke-width="4"/><path d="M11 32 H53 M15 21 H49 M15 43 H49" fill="none" stroke="#8FBFAF" stroke-width="4"/></svg></span>
      <span class="dot" data-dot="browser"></span>
    </button>
    <button class="launcher" id="app-terminal" data-app="terminal" tabindex="0" aria-label="Terminal">
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 64 64"><rect x="12" y="14" width="40" height="36" rx="6" fill="none" stroke="#B9A6E6" stroke-width="4.5"/><path d="M20 26 L28 32 L20 38 M32 40 H44" fill="none" stroke="#B9A6E6" stroke-width="4.5" stroke-linecap="round"/></svg></span>
      <span class="dot" data-dot="terminal"></span>
    </button>
    <button class="launcher" id="app-settings" data-app="settings" tabindex="0" aria-label="Settings">
      <span class="glyph" aria-hidden="true"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="9" fill="none" stroke="#9BB3C9" stroke-width="4.5"/><g fill="none" stroke="#9BB3C9" stroke-width="4.5" stroke-linecap="round"><path d="M32 10 V18 M32 46 V54 M10 32 H18 M46 32 H54 M17 17 L23 23 M41 41 L47 47 M47 17 L41 23 M23 41 L17 47"/></g></svg></span>
      <span class="dot" data-dot="settings"></span>
    </button>
    <span class="divider" aria-hidden="true"></span>
    <button class="clock" id="clock" tabindex="0" aria-label="Clock">
      <span class="clock-day" id="clock-day">Wed</span>
      <span class="clock-time" id="clock-time">--:--</span>
    </button>
  </main>
  <div class="tip" id="tip" role="tooltip"></div>
  <script type="module" src="/js/taskbar.js"></script>
</body>
</html>
