<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Bun Bun, the Bunny OS mascot">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff4fa"/>
      <stop offset="1" stop-color="#ffd9ec"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb6d9"/>
      <stop offset="1" stop-color="#ff7fbb"/>
    </linearGradient>
    <radialGradient id="cheek" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7fbb" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7fbb" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- ears -->
  <g fill="url(#fur)">
    <ellipse cx="44" cy="27" rx="10" ry="24" transform="rotate(-12 44 27)"/>
    <ellipse cx="76" cy="27" rx="10" ry="24" transform="rotate(12 76 27)"/>
  </g>
  <g fill="url(#inner)">
    <ellipse cx="45" cy="28" rx="4.6" ry="16" transform="rotate(-12 45 28)"/>
    <ellipse cx="75" cy="28" rx="4.6" ry="16" transform="rotate(12 75 28)"/>
  </g>
  <!-- head -->
  <ellipse cx="60" cy="68" rx="31" ry="28" fill="url(#fur)"/>
  <!-- cheeks -->
  <circle cx="42" cy="74" r="9" fill="url(#cheek)"/>
  <circle cx="78" cy="74" r="9" fill="url(#cheek)"/>
  <!-- eyes -->
  <g fill="#2a1520">
    <ellipse cx="50" cy="66" rx="3.4" ry="4.2"/>
    <ellipse cx="70" cy="66" rx="3.4" ry="4.2"/>
  </g>
  <g fill="#fff" opacity="0.9">
    <circle cx="51.2" cy="64.6" r="1.2"/>
    <circle cx="71.2" cy="64.6" r="1.2"/>
  </g>
  <!-- nose + mouth -->
  <path d="M60 72.5c1.7 0 3 1 3 2.2 0 1.2-1.3 2.3-3 2.3s-3-1.1-3-2.3c0-1.2 1.3-2.2 3-2.2Z" fill="#ff8ac7"/>
  <path d="M60 77c0 3-2.6 5.2-5.6 4.4M60 77c0 3 2.6 5.2 5.6 4.4"
        fill="none" stroke="#d4518f" stroke-width="1.6" stroke-linecap="round"/>
  <!-- whiskers -->
  <g stroke="#e7a9c6" stroke-width="1.3" stroke-linecap="round" opacity="0.8">
    <path d="M34 72l-8-2M34 77l-8 2M86 72l8-2M86 77l8 2"/>
  </g>
  <!-- bow -->
  <g transform="translate(84 46) rotate(12)">
    <path d="M0 0c-7-6-15-4-15 3s8 9 15 3Z" fill="#8ef0c6"/>
    <path d="M0 0c7-6 15-4 15 3s-8 9-15 3Z" fill="#8ef0c6"/>
    <circle cx="0" cy="3" r="3.2" fill="#4fd6a1"/>
  </g>
</svg>
