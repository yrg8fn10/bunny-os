# Anaconda profile for the Bunny OS live medium.
#
# The installed system is a bootc image, so the partitioning has to match what
# Bazzite expects (BTRFS, /var as a subvolume) and the EFI directory has to be
# the one the payload was built with.  Values mirror ublue-os/bazzite
# installer/system_files/shared/etc/anaconda/profile.d/bazzite.conf, which is
# known to produce a Deck that boots.
[Profile]
profile_id = bazzite

[Profile Detection]
# The live environment is the Bazzite desktop image, so this is what matches.
os_id = bazzite

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Bootloader]
efi_dir = fedora
menu_auto_hide = True

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
    /var  (btrfs)

[User Interface]
# The live session is already online; asking again in the installer only
# confuses a controller-only install.
hidden_webui_pages =
    network

[Localization]
use_geolocation = False
