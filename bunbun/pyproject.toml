[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bunny-bunbun"
version = "0.1.0"
description = "Bun Bun — local AI co-op companion for Bunny OS (MAM engine)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bunny OS Contributors" }]
dependencies = []

[project.optional-dependencies]
# Optional, all discovered at runtime. The base agent needs nothing.
neural-tts = ["piper-tts>=1.2"]
dev = ["ruff>=0.5", "mypy>=1.10"]

[project.scripts]
bunbun = "bunbun.cli:main"

[tool.setuptools.packages.find]
include = ["bunbun*"]

[tool.setuptools.package-data]
bunbun = ["data/*.json", "data/hints/*.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
ignore_missing_imports = true
