# Static SDDM configuration for Bunny OS.
#
# The [Autologin] section is deliberately NOT here: bunny-sessiond owns it in
# 20-bunny-session.conf so that switching modes or turning autologin off does
# not require editing a build-time file.

[General]
DisplayServer=wayland
Numlock=on
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot

[Theme]
Current=breeze
CursorTheme=breeze_cursors
Font=Noto Sans,10

[Wayland]
EnableHiDPI=true
