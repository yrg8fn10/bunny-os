# Bunny OS session configuration (read by bunny-sessiond and bunny-session).
BUNNY_DEFAULT_MODE=gaming
BUNNY_GAMING_SESSION=bunny-gaming
BUNNY_DESKTOP_SESSION=bunny-desktop
BUNNY_USER=bunny
BUNNY_USE_GAMESCOPE=1
BUNNY_GAMESCOPE_ARGS="-W 1920 -H 1080 -r 60 --adaptive-sync --force-grab-cursor"
BUNNY_AGENT=1
