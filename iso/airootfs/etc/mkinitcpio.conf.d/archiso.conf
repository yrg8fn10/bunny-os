# archiso's initramfs configuration, copied verbatim from upstream
# (archiso: configs/releng/airootfs/etc/mkinitcpio.conf.d/archiso.conf).
#
# Without this drop-in mkinitcpio uses Arch's stock configuration, which knows
# only root= and systemd's gpt-auto discovery. The resulting initramfs boots the
# kernel and then cannot find the live root: it either waits out
# /dev/gpt-auto-root or stops at "Failed to start Switch Root". The archiso hook
# is what mounts the medium by label, mounts airootfs.sfs and assembles the
# copy-on-write overlay before switching root.
# Only the hooks a USB live image needs. Upstream releng also enables the PXE
# and loop-mount hooks; those pull in nbd-client, ipconfig and nfsmount, which
# this image does not ship, and mkinitcpio then warns "errors were encountered
# during the build" on every run - noise that hides real failures.
HOOKS=(base udev microcode modconf kms memdisk archiso block filesystems keyboard)
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
