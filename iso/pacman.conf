#
# /etc/pacman.conf for the Bunny OS live image (mirrors archiso defaults).
# multilib is REQUIRED: Steam and 32-bit graphics libraries live there.
#
[options]
HoldPkg      = pacman glibc
Architecture = auto
Color
ILoveCandy
CheckSpace
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional
# Bunny OS: reproducibility / integrity
SandboxUser = _alpm

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
