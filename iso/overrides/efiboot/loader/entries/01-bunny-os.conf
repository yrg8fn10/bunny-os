title   Bunny OS @VERSION@ (Gaming Mode)
linux   /arch/boot/x86_64/vmlinuz-linux
# Microcode is embedded in initramfs-linux.img by mkinitcpio. archiso sets
# need_external_ucodes=0 in that case and never copies /arch/boot/*-ucode.img,
# so referencing those files here makes systemd-boot abort with
# "Error preparing initrd: Not found".
initrd  /arch/boot/x86_64/initramfs-linux.img
options archisobasedir=arch archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=4G quiet splash loglevel=3
