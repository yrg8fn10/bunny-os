title   Bunny OS @VERSION@ (Gaming Mode)
linux   /arch/boot/x86_64/vmlinuz-linux
# Microcode is embedded in initramfs-linux.img by mkinitcpio. archiso sets
# need_external_ucodes=0 in that case and never copies /arch/boot/*-ucode.img,
# so referencing those files here makes systemd-boot abort with
# "Error preparing initrd: Not found".
initrd  /arch/boot/x86_64/initramfs-linux.img
# systemd.gpt_auto=0 disables systemd-gpt-auto-generator. The archiso hook
# already mounts the real root by volume label, so the kernel command line has
# no root=. systemd treats a missing root= as "discover it from GPT" and builds
# a unit for /dev/gpt-auto-root, which on machines that also carry root-type
# partitions (a Steam Deck running SteamOS on NVMe) times out and drops the
# live system into emergency mode.
options archisobasedir=arch archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=4G quiet splash loglevel=3 systemd.gpt_auto=0
