title   Bunny OS @VERSION@ (Setup Preview)
linux   /arch/boot/x86_64/vmlinuz-linux
initrd  /arch/boot/x86_64/initramfs-linux.img
# bunny.oobe=1 runs the first-boot wizard on the live medium even though the
# live image presets /var/lib/bunny/.oobe-done. Everything happens in the RAM
# overlay, so a reboot returns to Gaming Mode with nothing installed.
options archisobasedir=arch archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=4G bunny.oobe=1 quiet splash loglevel=3 systemd.gpt_auto=0
