title   Bunny OS @VERSION@ (Recovery & Maintenance)
linux   /arch/boot/x86_64/vmlinuz-linux
initrd  /arch/boot/x86_64/initramfs-linux.img
# systemd.unit=multi-user.target deliberately skips the graphical target, so
# SDDM never starts and bunny-recovery.service owns tty1 uncontested. Without
# it the greeter and the console menu race for the display manager.
options archisobasedir=arch archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=4G bunny.recovery=1 systemd.unit=multi-user.target systemd.gpt_auto=0 quiet splash loglevel=3
