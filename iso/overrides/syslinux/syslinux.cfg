UI vesamenu.c32
MENU TITLE Bunny OS @VERSION@
MENU CLEAR
PROMPT 0
TIMEOUT 50
DEFAULT bunny
# Microcode is embedded in the initramfs by mkinitcpio, and archiso does not
# copy /arch/boot/*-ucode.img when that is the case. Referencing the ucode
# images here makes the bootloader abort with "Not found".

# systemd.gpt_auto=0 disables systemd-gpt-auto-generator. The archiso hook
# already mounts the real root by volume label, so there is no root= on the
# command line, and systemd would otherwise try to discover one from GPT and
# time out waiting for /dev/gpt-auto-root.
LABEL bunny
  MENU LABEL ^Bunny OS — Gaming Mode
  LINUX /arch/boot/x86_64/vmlinuz-linux
  INITRD /arch/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=arch archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=4G quiet splash loglevel=3 systemd.gpt_auto=0

LABEL bunny-nomodeset
  MENU LABEL Bunny OS — ^Safe Graphics
  LINUX /arch/boot/x86_64/vmlinuz-linux
  INITRD /arch/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=arch archisolabel=%ARCHISO_LABEL% nomodeset copytoram=n quiet systemd.gpt_auto=0

LABEL bunny-ram
  MENU LABEL Bunny OS — Copy to RAM (needs 8 GB+)
  LINUX /arch/boot/x86_64/vmlinuz-linux
  INITRD /arch/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=arch archisolabel=%ARCHISO_LABEL% copytoram=y cow_spacesize=8G quiet systemd.gpt_auto=0
