UI vesamenu.c32
MENU TITLE Bunny OS @VERSION@
MENU CLEAR
PROMPT 0
TIMEOUT 50
DEFAULT bunny

LABEL bunny
  MENU LABEL ^Bunny OS — Gaming Mode
  LINUX /arch/boot/x86_64/vmlinuz-linux
  INITRD /arch/boot/intel-ucode.img
  INITRD /arch/boot/amd-ucode.img
  INITRD /arch/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=arch archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=4G quiet splash loglevel=3

LABEL bunny-nomodeset
  MENU LABEL Bunny OS — ^Safe Graphics
  LINUX /arch/boot/x86_64/vmlinuz-linux
  INITRD /arch/boot/intel-ucode.img
  INITRD /arch/boot/amd-ucode.img
  INITRD /arch/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=arch archisolabel=%ARCHISO_LABEL% nomodeset copytoram=n quiet

LABEL bunny-ram
  MENU LABEL Bunny OS — Copy to RAM (needs 8 GB+)
  LINUX /arch/boot/x86_64/vmlinuz-linux
  INITRD /arch/boot/intel-ucode.img
  INITRD /arch/boot/amd-ucode.img
  INITRD /arch/boot/x86_64/initramfs-linux.img
  APPEND archisobasedir=arch archisolabel=%ARCHISO_LABEL% copytoram=y cow_spacesize=8G quiet
