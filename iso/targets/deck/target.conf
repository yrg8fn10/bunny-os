# =============================================================================
#  Bunny OS build target — Steam Deck LCD (Valve "Jupiter", 2022 LCD model).
#
#  This file is consumed twice:
#    * by build_bunny_os_iso.sh and scripts/stage-profile.sh at build time
#    * at runtime, copied into the image as /etc/bunny/target.conf and sourced
#      by bunny-session and bunny-install
#
#  Only BUNNY_* keys belong here. Keep the file valid POSIX-ish bash.
#  The OLED model ("Galileo") is NOT covered by this profile yet.
# =============================================================================
BUNNY_TARGET_ID="deck"
BUNNY_TARGET_NAME="Steam Deck LCD"
BUNNY_ISO_BASENAME="BunnyOS-deck-installer"

# Native panel is 1280x800 @ 60 Hz. gamescope renders at the panel resolution
# so the Deck does not waste GPU headroom on a 1080p internal surface.
BUNNY_GAMESCOPE_ARGS="-W 1280 -H 800 -r 60 --force-grab-cursor"

# Van Gogh (Zen 2 + RDNA 2). Select the active amd-pstate mode, the mode
# SteamOS uses on this APU. No Valve kernel patches are required for it.
BUNNY_KERNEL_ARGS="amd_pstate=active"
