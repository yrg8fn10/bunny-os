title   Bunny OS @VERSION@ (Steam Deck LCD - Setup Preview)
linux   /arch/boot/x86_64/vmlinuz-linux
# amd-ucode is embedded in the initramfs; archiso does not ship a separate
# /arch/boot/amd-ucode.img, so referencing it breaks the boot.
initrd  /arch/boot/x86_64/initramfs-linux.img
# bunny.oobe=1 runs the first-boot wizard on the live medium even though the
# live image presets /var/lib/bunny/.oobe-done. Everything happens in the RAM
# overlay, so a reboot returns to Gaming Mode with nothing installed.
options archisobasedir=arch archisolabel=%ARCHISO_LABEL% copytoram=n cow_spacesize=4G bunny.oobe=1 quiet splash loglevel=3 amd_pstate=active systemd.gpt_auto=0
